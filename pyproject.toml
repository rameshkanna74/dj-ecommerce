[project]
name = "corecart"
version = "1.0.0"
description = "CoreCart 1.0 - multi-vendor e-commerce marketplace: Django REST Framework API (plus server-rendered pages)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pillow>=12.0.0",
]

[project.optional-dependencies]
# Install with `uv sync --extra postgres` when DB_ENGINE=postgresql.
postgres = [
    "psycopg[binary]>=3.2",
]
# Everything a production deployment needs: `uv sync --extra production`.
production = [
    "django-storages[s3]>=1.14.6",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
