[project]
name = "corecart"
version = "1.0.0"
description = "CoreCart 1.0 - a server-rendered multi-vendor e-commerce marketplace built with Django."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "pillow>=12.0.0",
]

[project.optional-dependencies]
# Install with `uv sync --extra postgres` when DB_ENGINE=postgresql.
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
