# CoreCart on a single EC2 instance, behind CloudFront (which terminates HTTPS).
# __ADMIN_URL__ is replaced by remote.sh with DJANGO_ADMIN_URL.
upstream corecart_django {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;

    # Only requests that came through our CloudFront distribution carry the secret header
    # (see 00-corecart-origin.conf). The security group also only admits CloudFront IPs.
    if ($corecart_origin_ok = 0) {
        return 403;
    }

    root /opt/corecart/current/frontend/dist;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://corecart_django;
        include /etc/nginx/corecart_proxy_params;
    }

    location /__ADMIN_URL__/ {
        proxy_pass http://corecart_django;
        include /etc/nginx/corecart_proxy_params;
    }

    # Django static files (hashed names from ManifestStaticFilesStorage).
    location /static/ {
        alias /var/lib/corecart/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Uploaded product images. Never executed, never sniffed.
    location /media/ {
        alias /var/lib/corecart/media/;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Vite build output (hashed names).
    location /assets/ {
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # React SPA: every other path renders index.html (client-side routing).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
