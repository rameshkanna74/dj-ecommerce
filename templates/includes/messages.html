{% if messages %}
<div class="messages" role="status" aria-live="polite">
  {% for message in messages %}
    <div class="alert alert--{{ message.level_tag|default:'info' }}">
      <span>{{ message }}</span>
      <button type="button" class="alert__close" data-dismiss aria-label="Dismiss message">&times;</button>
    </div>
  {% endfor %}
</div>
{% endif %}
