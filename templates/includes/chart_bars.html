{% load core_tags %}{% if has_data %}
<ul class="hbars" aria-label="{{ title }}">
  {% for row in rows %}
  <li>
    <div class="split"><span>{{ row.label }}</span><strong>{{ row.value|money }}{% if row.units is not None %} <span class="text-muted">· {{ row.units }} sold</span>{% endif %}</strong></div>
    <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width: {{ row.percent }}%"></div></div>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="text-muted">No data yet.</p>
{% endif %}
